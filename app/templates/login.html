<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoReport — Connexion</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg-primary: #fafafa;
      --bg-secondary: #ffffff;
      --bg-accent: #fff8f0;
      --border-light: #e5e7eb;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --primary: #f97316;
      --primary-dark: #ea580c;
      --primary-light: #fed7aa;
      --danger: #ef4444;
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }

      50% {
        transform: translate(-20px, 20px) rotate(180deg);
      }
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(135deg, var(--bg-accent) 0%, var(--bg-secondary) 100%);
      padding: 2.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border-light);
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 2rem;
      box-shadow: var(--shadow-md);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    .login-title {
      font-size: 1.875rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .login-body {
      padding: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-md);
      font-size: 1rem;
      color: var(--text-primary);
      background: var(--bg-secondary);
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-md);
      margin-top: 0.5rem;
    }

    .btn-submit:hover:not(:disabled) {
      box-shadow: var(--shadow-xl);
      transform: translateY(-2px);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .demo-hint {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--bg-accent);
      border: 1px solid var(--primary-light);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .demo-hint strong {
      color: var(--primary-dark);
      font-weight: 700;
    }

    .alert {
      padding: 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .alert-error::before {
      content: "⚠️";
      font-size: 1.25rem;
    }

    .login-footer {
      padding: 1.5rem 2rem;
      background: var(--bg-primary);
      border-top: 1px solid var(--border-light);
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .password-toggle {
      position: relative;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.5rem;
      font-size: 1.25rem;
      transition: color 0.2s ease;
    }

    .password-toggle-btn:hover {
      color: var(--text-primary);
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon">R</div>
        <h1 class="login-title">RestoReport</h1>
        <p class="login-subtitle">Tableau de bord marketing intelligent pour restauration</p>
      </div>

      <div class="login-body">
        {% if erreur %}
        <div class="alert alert-error">
          {{ erreur }}
        </div>
        {% endif %}

        <form method="POST" action="/login" id="loginForm">
          <div class="form-group">
            <label for="username" class="form-label">Identifiant</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Entrez votre identifiant"
              required autocomplete="username" autofocus>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Mot de passe</label>
            <div class="password-toggle">
              <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required
                autocomplete="current-password">
              <button type="button" class="password-toggle-btn" id="togglePassword"
                aria-label="Afficher/masquer le mot de passe">
                👁️
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            Se connecter
          </button>
        </form>

        <div class="demo-hint">
          💡 <strong>Compte de démonstration :</strong><br>
          Identifiant : <strong>admin</strong> • Mot de passe : <strong>admin</strong>
        </div>
      </div>

      <div class="login-footer">
        🔒 Connexion sécurisée • RestoReport &copy; 2026
      </div>
    </div>
  </div>

  <script>
    // Password toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // Form submission with loading state
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const originalBtnText = submitBtn.innerHTML;

    loginForm.addEventListener('submit', () => {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Connexion en cours...';
    });

    // Re-enable button if page is shown again (back button)
    window.addEventListener('pageshow', () => {
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalBtnText;
    });
  </script>
</body>

</html>
