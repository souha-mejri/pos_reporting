<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoReport — Connexion</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #fffaf5;
      --bg-soft: #fff3e7;
      --panel: #ffffff;
      --text: #2d201c;
      --muted: #766157;
      --primary: #f57c22;
      --primary-strong: #dd6610;
      --primary-soft: rgba(245,124,34,0.12);
      --border: #f2d8bf;
      --shadow: 0 26px 60px rgba(86, 51, 27, 0.12);
      --success: #1ea66d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Manrope", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(245,124,34,0.10), transparent 35%),
        linear-gradient(135deg, #fffaf5 0%, #fff2e8 100%);
      color: var(--text);
      line-height: 1.5;
    }

    .login-shell {
      width: min(440px, calc(100% - 24px));
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .brand-band {
      padding: 24px 20px 18px;
      text-align: center;
      background: linear-gradient(135deg, #fff5ee 0%, #fff0e8 100%);
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
      font-weight: 900;
      font-size: 1.3rem;
      box-shadow: 0 12px 24px rgba(245,124,34,0.2);
    }

    .brand-band h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .brand-band p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .form-wrap {
      padding: 24px 20px 22px;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: #fffaf7;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: rgba(245,124,34,0.7);
      box-shadow: 0 0 0 4px rgba(245,124,34,0.12);
      background: white;
    }

    .submit-btn {
      margin-top: 6px;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 16px 26px rgba(245,124,34,0.22);
    }

    .submit-btn:hover {
      transform: translateY(-1px);
    }

    .hint {
      margin-top: 8px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hint strong {
      color: var(--primary-strong);
    }

    .flash {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      background: rgba(30,166,109,0.08);
      color: var(--success);
      border: 1px solid rgba(30,166,109,0.12);
    }

    .flash.error {
      background: rgba(220, 96, 26, 0.08);
      color: #b64e1b;
      border-color: rgba(220, 96, 26, 0.12);
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="brand-band">
      <div class="brand-mark">R</div>
      <h1>RestoReport</h1>
      <p>Tableau de bord marketing pour restauration</p>
    </div>

    <div class="form-wrap">
      <form method="POST" action="/login">
        <label>
          Email ou identifiant
          <input type="text" name="username" placeholder="admin" required>
        </label>

        <label>
          Mot de passe
          <input type="password" name="password" placeholder="••••••••" required>
        </label>

        <button type="submit" class="submit-btn">Se connecter</button>
      </form>

      <div class="hint">Compte de test : <strong>admin / admin</strong></div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {% if category == 'error' %}error{% endif %}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </div>
  </div>
</body>
</html>
