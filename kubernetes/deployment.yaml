apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-reporting
  namespace: pos-reporting
spec:
  replicas: 1  # ⚠️ toujours 1 - APScheduler ne supporte pas le multi-replica
  selector:
    matchLabels:
      app: pos-reporting
  template:
    metadata:
      labels:
        app: pos-reporting
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: pos-reporting
          image: ghcr.io/VOTRE_USER_GITHUB/pos-reporting:latest
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: app-env
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pos-reporting-data
