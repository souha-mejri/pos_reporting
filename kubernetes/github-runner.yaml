apiVersion: v1
kind: Namespace
metadata:
  name: github-runner

---
apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: github-runner
type: Opaque
stringData:
  # Remplacez par votre token GitHub (Settings > Actions > Runners > New runner)
  token: "VOTRE_TOKEN_ICI"
  url: "https://github.com/souha-mejri/pos_reporting"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner
  namespace: github-runner

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-runner-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: github-runner

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner
      containers:
        - name: runner
          image: myoung34/github-runner:latest
          env:
            - name: REPO_URL
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: url
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: RUNNER_WORKDIR
              value: /tmp/runner
            - name: RUNNER_GROUP
              value: "default"
            - name: RUNNER_SCOPE
              value: "repo"
            - name: LABELS
              value: "self-hosted,linux,x64"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: work
              mountPath: /tmp/runner
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: work
          emptyDir: {}
